<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="sig-title sig-desc">
  <title id="sig-title">README made with beautify-github-readme</title>
  <desc id="sig-desc">该 README 的视觉素材由 beautify-github-readme 制作。</desc>

  <rect width="420" height="64" rx="16" fill="#0B1C3C" stroke="#244066"/>

  <!-- motif: Gate Card 卡 chip -->
  <g transform="translate(64 25)">
    <rect width="20" height="15" rx="3" fill="none" stroke="#1578FF" stroke-width="1.6"/>
    <path d="M0 5.5H6.5M0 9.5H6.5" stroke="#1578FF" stroke-width="1.2"/>
    <rect x="12" y="5" width="3" height="5" rx="1" fill="#8FF0C8"/>
  </g>

  <g font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="98" y="27" font-size="14" font-weight="600" letter-spacing="1.6" fill="#7993C4">README MADE WITH</text>
    <text x="98" y="48" font-size="18" font-weight="700" fill="#FFFFFF">beautify-github-readme</text>
  </g>

  <text x="356" y="44" text-anchor="end" font-size="20" fill="#1578FF" font-family="-apple-system,'Segoe UI',sans-serif">↗</text>
</svg>
